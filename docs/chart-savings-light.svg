<svg xmlns="http://www.w3.org/2000/svg" width="760" height="196" viewBox="0 0 760 196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Splitting a long chat costs 16% less. 4,756 real API calls across 4 projects, replayed as if each project had been one chat">
<text x="0" y="24" font-size="17" font-weight="700" fill="#0b0b0b">Splitting a long chat costs 16% less</text>
<text x="0" y="48" font-size="13" fill="#52514e">4,756 real API calls across 4 projects, replayed as if each project had been one chat</text>
<line x1="232" y1="66" x2="232" y2="160" stroke="#e4e3de" stroke-width="1"/>
<text x="218" y="99" font-size="13" text-anchor="end" fill="#0b0b0b">50 chats, handed off</text>
<path d="M233 78 h311 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-311 z" fill="#2a78d6"/>
<text x="559" y="98" font-size="13" font-weight="700" fill="#0b0b0b">834.1M</text>
<text x="218" y="143" font-size="13" text-anchor="end" fill="#0b0b0b">the same work in ONE chat</text>
<path d="M233 122 h361 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-361 z" fill="#eb6834"/>
<text x="609" y="142" font-size="13" font-weight="700" fill="#0b0b0b">967.3M</text>
<g transform="translate(232,172)"><g><rect x="0" y="0" width="10" height="10" rx="2" fill="#2a78d6"/><text x="16" y="9" font-size="12" fill="#52514e">measured</text><rect x="86" y="0" width="10" height="10" rx="2" fill="#eb6834"/><text x="102" y="9" font-size="12" fill="#52514e">counterfactual</text></g></g></svg>